services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://securecross_user:securecross_secure_password@postgres:5432/securecross_db
      - SECURECROSS_SECRET=securecross-auth-secret-key-change-in-production
      - SECURECROSS_DAILY_LIMIT=50000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: securecross_postgres
    restart: always
    environment:
      POSTGRES_USER: securecross_user
      POSTGRES_PASSWORD: securecross_secure_password
      POSTGRES_DB: securecross_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securecross_user -d securecross_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
